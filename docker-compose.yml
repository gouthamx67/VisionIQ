services:
  backend:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: sqlite:////app/data/visioniq.db
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
