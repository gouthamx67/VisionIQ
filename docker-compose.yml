version: '3.8'
services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./dataset:/app/dataset
      - ./ml:/app/ml
    environment:
      - DATABASE_URL=sqlite:///./visioniq.db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
