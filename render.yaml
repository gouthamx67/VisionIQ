services:
  - type: web
    name: visioniq-backend
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      PORT: 10000
      FRONTEND_URL:
        fromService:
          type: static
          name: visioniq-frontend
          property: url
    healthCheckPath: /health
    autoDeploy: true

  - type: static
    name: visioniq-frontend
    env: docker
    plan: free
    buildCommand: npm run build
    startCommand: nginx -g "daemon off;"
    dockerfilePath: frontend/Dockerfile
    publishPath: frontend/dist
    envVars:
      # Explicitly set the backend URL - change this if your backend service name changes
      VITE_API_BASE: https://visioniq-backend-1nvl.onrender.com
      FRONTEND_URL:
        fromService:
          type: web
          name: visioniq-backend
          property: web.service.uri
    autoDeploy: true